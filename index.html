<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Etcher</title>
  <link rel="stylesheet" href="/shared/style.css">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="bar ebar">
    <h1>Etcher</h1>
    <input id="title" class="title" aria-label="Title" value="Untitled drawing">
    <span class="spacer"></span>
    <button id="new">New</button>
    <button id="open">Open…</button>
    <button id="save">Save</button>
    <select id="export" aria-label="Export"><option value="">Export…</option><option value="svg">Drawing (.svg)</option><option value="png">Picture (.png)</option><option value="pl">Prolog form (.pl)</option></select>
  </header>
  <main class="etcher">
    <section class="panel board">
      <div class="tools" role="toolbar" aria-label="Tools">
        <button data-tool="select" class="on" title="Select, move and resize (V)">↖ Select</button>
        <button data-tool="rect" title="Box">▭</button>
        <button data-tool="circle" title="Circle">◯</button>
        <button data-tool="diamond" title="Diamond">◇</button>
        <button data-tool="triangle" title="Triangle">△</button>
        <button data-tool="star" title="Star">☆</button>
        <button data-tool="line" title="Line">╱</button>
        <button data-tool="arrow" title="Arrow">→</button>
        <button data-tool="text" title="Text">T</button>
        <button data-tool="connect" title="Connect two shapes with an arrow">⇢ Connect</button>
        <span class="sep"></span>
        <label title="Fill">Fill <input id="fill" type="color" value="#3a7bd5"></label>
        <label title="Outline">Line <input id="stroke" type="color" value="#222222"></label>
        <select id="width" aria-label="Line width"><option value="1">thin</option><option value="2" selected>normal</option><option value="4">thick</option></select>
        <span class="sep"></span>
        <button id="front" title="Bring to front">Front</button>
        <button id="back" title="Send to back">Back</button>
        <button id="label" title="Write a label in the shape">Label</button>
        <button id="del" title="Delete (Del)">Delete</button>
        <button id="undo">Undo</button>
        <button id="redo">Redo</button>
      </div>
      <div class="canvaswrap"><div id="canvas" class="canvas" aria-label="Drawing" tabindex="0"></div></div>
      <p id="caption" class="caption"></p>
      <form id="say" class="row say"><input id="sayText" type="text" placeholder='Tell Lucian: "draw a red circle above a blue square", "make it bigger", "rotate the star 45 degrees", "make the box 3D"'><button>Do</button></form>
      <p id="reply" class="quiet" aria-live="polite"></p>
    </section>
    <aside class="panel side">
      <div id="question" class="question" aria-live="polite"></div>
      <nav class="tabs" id="tabs" role="tablist"></nav>
      <div id="tool"></div>
    </aside>
  </main>
</body>
</html>
